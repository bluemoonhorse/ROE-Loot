function bindMain(){const m=$('#main');m.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});m.querySelectorAll('[data-group-field]').forEach(i=>i.onchange=()=>{let g=get(activeId);let key=i.dataset.groupField;if(key==='iID'&&controls().some(x=>x!==g&&String(x.iID)===i.value)){alert(language==='ru'?'Такой ID уже существует':'That group ID already exists');i.value=g.iID;return}g[key]=i.value;if(key==='iMapID')for(let r of pool(activeId))r.iMapID=i.value;if(key==='vNumPercent'&&section==='vehicles')g.num_percent_array=String(i.value).split(';').filter(Boolean).map(num);if(key==='iID'){for(let r of pool(activeId))r.iCtrlID=i.value;activeId=i.value}setDirty();render()});m.querySelectorAll('[data-dist]').forEach(i=>i.onchange=()=>{let g=get(activeId),arr=pctArray(g);arr[Number(i.dataset.dist)]=num(i.value);syncPct(g,arr);setDirty();render()});m.querySelectorAll('[data-rowfield]').forEach(i=>i.onchange=()=>{let r=contents().find(x=>String(x.iID)===i.dataset.row);if(!r)return;r[i.dataset.rowfield]=i.value;setDirty();render()});m.querySelectorAll('[data-loc]').forEach(i=>i.onchange=()=>{let id=i.dataset.item;names[id]=names[id]||{en:'',ru:''};names[id][i.dataset.loc]=i.value;setDirty();render()});$('#model')?.addEventListener('change',e=>{model=e.target.value;render()});$('#pctSource')?.addEventListener('change',e=>{let g=get(activeId);g._pctSource=e.target.value;if(e.target.value==='scalar'){let arr=String(g.vNumPercent||'').split(';').filter(Boolean).map(x=>num(x));g.num_percent_array=arr}render()});$('#itemSearch')?.addEventListener('input',()=>{let el=$('#itemSearch'),pos=el.selectionStart;render();$('#itemSearch')?.focus();$('#itemSearch')?.setSelectionRange(pos,pos)});m.querySelector('[data-action="add-dist"]')?.addEventListener('click',()=>{let g=get(activeId),a=pctArray(g);a.push(0);syncPct(g,a);setDirty();render()});m.querySelector('[data-action="use-array"]')?.addEventListener('click',()=>{let g=get(activeId);syncPct(g,pctArray(g));setDirty();render()});m.querySelector('[data-action="use-scalar"]')?.addEventListener('click',()=>{let g=get(activeId);syncPct(g,String(g.vNumPercent).split(';').filter(Boolean).map(Number));setDirty();render()});m.querySelector('[data-action="delete-group"]')?.addEventListener('click',()=>{if(!confirm(language==='ru'?'Удалить группу и все её строки?':'Delete this group and all its rows?'))return;let t=keys[section][0],it=keys[section][1];db[t]=rows(t).filter(x=>String(x.iID)!==String(activeId));db[it]=rows(it).filter(x=>String(x.iCtrlID)!==String(activeId));activeId=controls()[0]?.iID??null;setDirty();render()});m.querySelector('[data-action="add-item"]')?.addEventListener('click',addItem);m.querySelectorAll('[data-action="delete-item"]').forEach(b=>b.onclick=()=>{db[keys[section][1]]=contents().filter(x=>String(x.iID)!==b.dataset.row);setDirty();render()})}
function addItem(){let sel=$('#newItem');if(!sel?.value){alert(language==='ru'?'Сначала выберите предмет из каталога':'Choose a catalog item first');return}let [itemID,...nameParts]=sel.value.split('|'),name=nameParts.join('|'),g=get(activeId),table=keys[section][1],template=rows(table).find(r=>String(r.iItemID)===itemID&&String(r.strItemName||'')===name),id=String(Math.max(0,...contents().map(x=>num(x.iID)))+1),row=template?clone(template):{};Object.assign(row,{iID:id,iMapID:g.iMapID,iCtrlID:g.iID,strItemName:name,iItemID:itemID,iCount:'1',source_line:0});contents().push(row);setDirty();render()}
function selectGroup(id){activeId=String(id);tab='contents';render()}
function addGroup(){let id=String(Math.max(0,...controls().map(x=>num(x.iID)))+1);if(section==='loot'){db.control.push({iID:id,strName:'New loot group',iMapID:'16010',iRadius:'200',iExtraMaxNum:'7',vNumPercent:'100',num_percent_array:[100],source_line:0});}else db.vehicle_control.push({iID:id,strName:'New vehicle pool',iMapID:'16010',iRadius:'0',iExtraMaxNum:'0',vNumPercent:'0',num_percent_array:[0],source_line:0});activeId=id;setDirty();render()}
function setSection(s){section=s;activeId=controls()[0]?.iID??null;tab='contents';render()}
function download(name,text,type='application/json'){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function projectBundle(){let clean=k=>rows(k).map(r=>Object.fromEntries(Object.entries(r).filter(([key])=>!key.startsWith('_'))));return {format:'roe-loot-editor-v1',model,translation:clone(names),tables:{control:clean('control'),items:clean('items'),vehicle_control:clean('vehicle_control'),vehicles:clean('vehicles')},source_notes:{original_server_algorithm_verified:false,description:'Editable copy of supplied ROE 2022 research tables. H1/H2 are research interpretations, not verified native behavior.'}}}
function exportBundle(){let out=projectBundle();download('roe-loot-tables-edited.json',JSON.stringify(out,null,2));dirty=false;$('#dirty').textContent='';$('#status').textContent=language==='ru'?'JSON экспортирован':'JSON exported'}
async function saveBackend(){if(location.protocol==='file:'){openModal('Backend required','Open ROE-Loot-Admin.exe to use server save and automatic backups. The standalone HTML still supports local import and export.');return}let b=$('#saveServer');b.disabled=true;try{let r=await fetch('/api/project',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(projectBundle())});let body=await r.json().catch(()=>({}));if(!r.ok){let detail=(body.errors||[]).join('\n')||body.error||`HTTP ${r.status}`;openModal('Could not save',detail);return}dirty=false;$('#dirty').textContent='';$('#status').textContent=language==='ru'?`Сохранено · резервная копия ${body.backup||'создана'}`:`Saved · backup ${body.backup||'created'}`}catch(e){openModal('Backend unavailable','Could not reach the local save service. Start ROE-Loot-Admin.exe and use its browser window.')}finally{b.disabled=false}}
function xmlEscape(v){return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function attrs(row,skip=[]){return Object.entries(row).filter(([k,v])=>!skip.includes(k)&&k!=='num_percent_array'&&k!=='source_line'&&!k.startsWith('_')&&v!==null&&v!==undefined&&String(v)!=='').map(([k,v])=>` ${k}="${xmlEscape(v)}"`).join('')}
function controlXml(type,tag,rowsArr){let countName=type==='control'?'m_vecLootCtrlInfo':'m_vecLootCtrlInfo',obj=type==='control'?'Data.Table.EuLoot.EuEntityLootControlCfgTable_1':'Data.Table.EuLoot.EuEntityLootControlCfgTable_vehicle',body=rowsArr.map(g=>{let arr=pctArray(g),header=`<${tag}${attrs(g)}>`;return `${header}\n  <vNumPercentArray IsStaticArray="0" ArrayCount="${arr.length}">\n${arr.map(v=>`   <vNumPercentArray v="${xmlEscape(v)}"/>`).join('\n')}\n  </vNumPercentArray>\n</${tag}>`}).join('\n');return `<?xml version="1.0" encoding="utf-8"?>\n<NewObj ObjName="${obj}" Version="1">\n <${countName} IsStaticArray="0" ArrayCount="${rowsArr.length}">\n${body}\n </${countName}>\n</NewObj>\n`}
function itemsXml(type,tag,rowsArr){let obj=type==='items'?'Data.Table.EuLoot.EuEntityLootItemCfgTable_1':'Data.Table.EuLoot.EuEntityLootItemCfgTable_vehicle',container=type==='items'?'m_vecLootItemInfo':'m_vecLootItemInfo',body=rowsArr.map(r=>`<${tag}${attrs(r)}/>`).join('\n');return `<?xml version="1.0" encoding="utf-8"?>\n<NewObj ObjName="${obj}" Version="1">\n <${container} IsStaticArray="0" ArrayCount="${rowsArr.length}">\n${body}\n </${container}>\n</NewObj>\n`}
function exportXML(){let csvSection=section;download(section==='loot'?'loot-control-edited.xml':'vehicle-control-edited.xml',controlXml(keys[section][0],section==='loot'?'m_vecLootCtrlInfo':'m_vecLootCtrlInfo',controls()),'application/xml');download(section==='loot'?'loot-items-edited.xml':'vehicles-edited.xml',itemsXml(keys[section][1],'m_vecLootItemInfo',contents()),'application/xml');dirty=false;$('#dirty').textContent='';$('#status').textContent=language==='ru'?'XML-таблицы экспортированы':'XML tables exported'}
function parseCSV(text){let out=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field);out.push(row);row=[];field=''}else if(c!=='\r')field+=c}if(field.length||row.length){row.push(field);out.push(row)}let headers=out.shift()||[];return out.filter(r=>r.some(Boolean)).map(vals=>{let o={};headers.forEach((h,i)=>{let v=vals[i]??'';if(h==='num_percent_array'||h==='vNumPercent'&&v.startsWith('[')){try{o[h]=JSON.parse(v)}catch{o[h]=v}}else o[h]=v});return o})}
function xmlRows(text,name){text=text.replace(/\s+\[XlsProp\]="[^"]*"/g,'');let doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw Error('XML parse failed');let isCtrl=name.includes('control'),isVehicle=name.includes('vehicle'),type=isVehicle?(isCtrl?'vehicle_control':'vehicles'):(isCtrl?'control':'items'),table=type==='control'?'control':type==='items'?'items':type==='vehicle_control'?'vehicle_control':'vehicles',targetMap=String(db[table]?.[0]?.iMapID||'16010'),nodeTag=isCtrl?'m_vecLootCtrlInfo':'m_vecLootItemInfo';let out=[],skipped=0;doc.querySelectorAll(nodeTag).forEach(el=>{if(!el.hasAttribute('iID'))return;let r={};for(let a of el.attributes)r[a.name]=a.value;if(String(r.iMapID||targetMap)!==targetMap){skipped++;return}if(isCtrl){r.num_percent_array=[...el.querySelectorAll('vNumPercentArray > vNumPercentArray')].map(x=>num(x.getAttribute('v')))}out.push(r)});return {type,rows:out,map:targetMap,skipped}}
function importJSON(obj){let t=obj.tables||obj;if(t.control?.rows)t.control=t.control.rows;if(t.items?.rows)t.items=t.items.rows;if(t.vehicle_control?.rows)t.vehicle_control=t.vehicle_control.rows;if(t.vehicles?.rows)t.vehicles=t.vehicles.rows;if(!Array.isArray(t.control)&&!Array.isArray(t.items)&&!Array.isArray(t.vehicle_control)&&!Array.isArray(t.vehicles))throw Error('This JSON is a generated plan, not a loot-table export. Import loot-export-and-h1.json or an editor JSON bundle.');for(let key of ['control','items','vehicle_control','vehicles'])if(Array.isArray(t[key]))db[key]=clone(t[key]);if(obj.translation)Object.assign(names,obj.translation);if(obj.tables?.control){}activeId=controls()[0]?.iID??null;setDirty(language==='ru'?'JSON импортирован':'JSON imported');render()}
async function importFiles(files){for(let f of files){let text=await f.text(),n=f.name.toLowerCase();if(n.endsWith('.json'))importJSON(JSON.parse(text));else if(n.endsWith('.xml')){let parsed=xmlRows(text,n);if(!parsed.rows.length)throw Error(`No rows found for map ${parsed.map} in ${f.name}`);db[parsed.type]=parsed.rows;activeId=controls()[0]?.iID??null;setDirty(`${f.name}: ${parsed.rows.length} rows, map ${parsed.map}${parsed.skipped?`, skipped ${parsed.skipped} rows from other maps`:''}`);render()}else if(n.endsWith('.csv')){let rr=parseCSV(text);let type=n.includes('vehicle_control')?'vehicle_control':n.includes('vehicles')?'vehicles':n.includes('control')?'control':n.includes('items')?'items':null;if(!type){let h=Object.keys(rr[0]||{});type=h.includes('strName')?'control':'items'}db[type]=rr;activeId=controls()[0]?.iID??null;setDirty(`${f.name} imported`);render()}}$('#status').textContent=language==='ru'?'Импорт завершён':'Import complete'}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').textContent=body;$('#modal').classList.add('open')}
$('#groups').addEventListener('click',e=>{let b=e.target.closest('[data-id]');if(b)selectGroup(b.dataset.id)});$('#groupSearch').addEventListener('input',groupSearchRender);$('#addGroup').onclick=addGroup;$$('.section-switch button').forEach(b=>b.onclick=()=>{ $$('.section-switch button').forEach(x=>x.classList.toggle('active',x===b));setSection(b.dataset.section)});$('#language').onchange=e=>{language=e.target.value;$('#saveServer').textContent=language==='ru'?'Сохранить':'Save';document.documentElement.lang=language;render()};$('#importBtn').onclick=()=>$('#filePicker').click();$('#filePicker').onchange=e=>importFiles(e.target.files).catch(err=>openModal('Import error',err.message));$('#saveServer').onclick=saveBackend;$('#exportJson').onclick=exportBundle;$('#exportXml').onclick=exportXML;$('#helpBtn').onclick=()=>openModal('About this editor','Local admin editor for the supplied ROE 2022 loot tables. Save stores the current project on this computer and creates a rolling backup. Import JSON bundles, CSV tables, or control/items XML; export edited JSON or the active table pair as XML. English/Russian labels are display translations; original source names and IDs remain editable. H1/H2 are documented research interpretations, not confirmed production-server behavior.');$('#modalClose').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};
async function startup(){for(let key of ['control','items','vehicle_control','vehicles'])if(!Array.isArray(db[key]))db[key]=[];if(!names['30003'])names['30003']={en:'9 mm / .45-compatible ammunition',ru:'Патроны 9 мм / совместимые с .45'};try{let r=await fetch('/api/project');if(r.ok&&r.status===200){let p=await r.json();if(p.tables){for(let key of ['control','items','vehicle_control','vehicles'])if(Array.isArray(p.tables[key]))db[key]=p.tables[key];if(p.translation)Object.assign(names,p.translation);if(p.model)model=p.model}}}catch{}activeId=controls()[0]?.iID??null;$('#language').value=language;render()}startup();
})();
